<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Užij.si – veřejné akce podle krajů</title>
<meta name="description" content="Přehled veřejně dostupných akcí v Česku podle krajů: sport, kino, divadlo, výstavy, koncerty.">
<meta property="og:title" content="Užij.si – veřejné akce podle krajů">
<meta property="og:site_name" content="Užij.si">
<meta property="og:description" content="Přehled veřejně dostupných akcí v Česku podle krajů: sport, kino, divadlo, výstavy, koncerty.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E✨%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="strip" id="strip"><div class="today" id="today"></div><div class="hl" id="hl"></div></div>
<header>
  <h1>Užij<span>.si</span></h1>
  <p class="tag">Kam vyrazit – veřejné akce podle krajů</p>
  <div class="search"><input id="q" type="search" placeholder="Hledat akci, místo nebo žánr…" aria-label="Hledat"></div>
  <div class="chips quick" id="quick" aria-label="Rychlé filtry"></div>
  <nav class="tabs" id="groups" aria-label="Hlavní sekce"></nav>
</header>
<main>
  <section class="filters">
    <label>Kraj
      <select id="region"></select>
    </label>
    <label id="cityw" hidden>Město
      <select id="city"></select>
    </label>
    <div class="chips sub" id="cats" aria-label="Podkategorie"></div>
    <div class="chips" id="dates" aria-label="Kdy"></div>
  </section>
  <section id="tops" class="tops" hidden>
    <h2>Nejvýraznější akce</h2>
    <ul id="toplist" class="list"></ul>
  </section>
  <h2 class="cal-h">Kalendář akcí</h2>
  <p id="info" class="info"></p>
  <ul id="list" class="list"></ul>
  <button id="more" hidden>Zobrazit další</button>
</main>
<footer>
  <h2>Zdroje a licence</h2>
  <ul id="sources"></ul>
  <p>Používáme jen veřejně a zdarma dostupné otevřené zdroje dat. Za správnost údajů odpovídá původní zdroj – před návštěvou si prosím akci ověřte na odkazu u ní.</p>
  <p id="gen"></p>
</footer>
<script src="svatky.js"></script>
<script src="app.js"></script>
</body>
</html>
