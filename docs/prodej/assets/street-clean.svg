<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="skyS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87B1D4"/>
      <stop offset="58%" stop-color="#C8DEEC"/>
      <stop offset="100%" stop-color="#EEF2EC"/>
    </linearGradient>
    <linearGradient id="grassS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#98AE7E"/>
      <stop offset="100%" stop-color="#768F5E"/>
    </linearGradient>
    <linearGradient id="roadS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E7277"/>
      <stop offset="100%" stop-color="#484C51"/>
    </linearGradient>
    <filter id="shS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1714" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1500" height="505" fill="url(#skyS)"/>
  <g fill="#FFFFFF" opacity="0.58">
    <ellipse cx="340" cy="150" rx="135" ry="30"/>
    <ellipse cx="1090" cy="175" rx="165" ry="34"/>
  </g>

  <!-- Open southern horizon (p.č. 21/1 & distant Czech countryside) -->
  <path d="M0,470 Q360,428 760,446 T1500,438 L1500,530 L0,530 Z" fill="#A5B7A2"/>
  <path d="M0,492 Q460,462 940,474 T1500,466 L1500,545 L0,545 Z" fill="#8A9F7E"/>

  <!-- Neighbor house st. 8 on the LEFT (east) & č.p. 20 on the RIGHT (west) -->
  <g>
    <rect x="40" y="385" width="230" height="145" fill="#E9E4D8"/>
    <polygon points="22,385 155,315 288,385" fill="#9E563B"/>
    <rect x="85" y="422" width="38" height="44" fill="#5D7484"/>
    <rect x="165" y="422" width="44" height="44" fill="#5D7484"/>
    <!-- Wall along 119/7 -->
    <polygon points="270,485 450,515 450,655 270,735" fill="#CFCAC0" stroke="#9A968D" stroke-width="1.5"/>
  </g>
  <g>
    <rect x="1150" y="378" width="290" height="155" fill="#E6E4DE"/>
    <polygon points="1130,378 1295,312 1460,378" fill="#A35D41"/>
    <rect x="1195" y="420" width="48" height="42" fill="#587080"/>
    <rect x="1285" y="420" width="48" height="42" fill="#587080"/>
    <!-- Fence of č.p. 20 on west side of entrance -->
    <polygon points="1030,520 1150,495 1150,735 1030,650" fill="#777B72" opacity="0.88"/>
  </g>

  <!-- Main parcel 11/4 opening up beyond entrance neck -->
  <polygon points="0,525 1500,525 1500,775 0,775" fill="url(#grassS)"/>
  <!-- Driveway strip 119/19 surface leading from road 128/2 into 11/4 -->
  <polygon points="440,758 1060,758 955,595 545,595" fill="#B5B1A3" opacity="0.72"/>

  <!-- Road verge & northern road p.č. 128/2 -->
  <rect x="0" y="750" width="1500" height="32" fill="#B7B3A8"/>
  <polygon points="0,782 1500,782 1500,1000 0,1000" fill="url(#roadS)"/>
  <line x1="0" y1="888" x2="1500" y2="888" stroke="#E2E1DC" stroke-width="3" stroke-dasharray="34 30" opacity="0.35"/>
  <g transform="translate(24, 944)">
    <rect x="0" y="0" width="372" height="34" rx="17" fill="#181A1B" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#D8C29D"/>
    <text x="32" y="21.5" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#F4F3EF">Ilustrační náhled – reálné foto bude doplněno</text>
  </g>
</svg>