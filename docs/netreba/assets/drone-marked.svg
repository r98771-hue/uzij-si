<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="meadowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA67A"/>
      <stop offset="55%" stop-color="#7D9668"/>
      <stop offset="100%" stop-color="#6F8A5B"/>
    </linearGradient>
    <linearGradient id="field21G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9BA8A"/>
      <stop offset="100%" stop-color="#B6A472"/>
    </linearGradient>
    <linearGradient id="parcelLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EB486"/>
      <stop offset="100%" stop-color="#8AA372"/>
    </linearGradient>
    <linearGradient id="drivewayG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9B4A6"/>
      <stop offset="100%" stop-color="#9FA988"/>
    </linearGradient>
    <linearGradient id="roofTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76A4A"/>
      <stop offset="100%" stop-color="#8B492F"/>
    </linearGradient>
    <linearGradient id="roofSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5056"/>
      <stop offset="100%" stop-color="#35393E"/>
    </linearGradient>
    <pattern id="mowP" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-21)">
      <rect width="13" height="26" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <pattern id="furrowP" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(21)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#8C7A4D" stroke-width="1.4" stroke-opacity="0.22"/>
    </pattern>
    <filter id="dropS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#1B2518" flood-opacity="0.28"/>
    </filter>
    <filter id="cardS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E1512" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1500" height="1000" fill="url(#meadowG)"/>
  <rect width="1500" height="1000" fill="url(#mowP)"/>

  <!-- Open southern field p.č. 21/1 -->
  <polygon points="0,500 323.1,629.1 1044.7,913.2 1353,1029.5 1500,1080 1500,1000 0,1000" fill="url(#field21G)"/>
  <polygon points="0,500 323.1,629.1 1044.7,913.2 1353,1029.5 1500,1080 1500,1000 0,1000" fill="url(#furrowP)"/>

  <!-- Natural sunlit garden area -->
  <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="url(#parcelLawn)"/>
  <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="url(#mowP)"/>
  <polygon points="1077.7,258.8 1158.2,267.5 1165.8,376 1046.4,338.8" fill="url(#drivewayG)"/>
  <polygon points="1183.2,655.2 1357.1,736 1353,1029.5 1044.7,913.2" fill="#7D9669"/>

  <!-- Northern asphalt road p.č. 128/2 -->
  <polygon points="350,-20 680,-20 1125,198 1520,242 1520,308 1095,256 620,10 350,-20" fill="#8C9783"/>
  <polygon points="410,-20 655,-20 1118,205 1520,250 1520,298 1095,248 610,0 410,-20" fill="#5D6166"/>
  <polyline points="525,-18 1106,227 1520,274" fill="none" stroke="#E5E4DF" stroke-width="2" stroke-dasharray="16 20" opacity="0.45"/>

  <!-- Neighboring houses -->
  <g filter="url(#dropS)">
    <polygon points="845,205 975,268 912,402 782,339" fill="url(#roofTerra)"/>
    <line x1="814" y1="272" x2="944" y2="335" stroke="#E3A487" stroke-width="2" opacity="0.6"/>
    <polygon points="755,478 885,532 855,606 725,552" fill="url(#roofSlate)"/>
    <polygon points="278,438 358,472 325,548 245,514" fill="url(#roofTerra)"/>
    <polygon points="495,55 645,122 595,232 445,165" fill="url(#roofTerra)"/>
    <polygon points="705,152 785,188 745,275 665,239" fill="url(#roofSlate)"/>
    <polygon points="1275,305 1425,368 1372,492 1222,429" fill="url(#roofTerra)"/>
    <polygon points="1165,432 1272,478 1244,544 1137,498" fill="url(#roofSlate)"/>
  </g>

  <!-- Trees -->
  <g opacity="0.92">
    <circle cx="485" cy="368" r="32" fill="#2A3923" opacity="0.28"/>
    <circle cx="478" cy="360" r="32" fill="#4B6A3C"/>
    <circle cx="471" cy="353" r="20" fill="#60814E"/>
    <circle cx="645" cy="435" r="28" fill="#2A3923" opacity="0.28"/>
    <circle cx="638" cy="428" r="28" fill="#547343"/>
    <circle cx="632" cy="422" r="17" fill="#698B56"/>
    <circle cx="1305" cy="695" r="38" fill="#2A3923" opacity="0.28"/>
    <circle cx="1296" cy="686" r="38" fill="#48663A"/>
    <circle cx="1288" cy="678" r="24" fill="#5D7E4B"/>
    <circle cx="195" cy="595" r="34" fill="#4B693C"/>
    <circle cx="1010" cy="410" r="22" fill="#567645" opacity="0.85"/>
  </g>
  <g>
    <!-- Parcel fills & crisp boundaries -->
    <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="#2D4A3E" fill-opacity="0.30" stroke="#FFFFFF" stroke-width="3.8" stroke-linejoin="round"/>
    <polygon points="1077.7,258.8 1158.2,267.5 1165.8,376 1046.4,338.8" fill="#A68A64" fill-opacity="0.44" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Corner points -->
    <g fill="#FFFFFF" stroke="#181A1B" stroke-width="2">
      <circle cx="1077.7" cy="258.8" r="5"/>
      <circle cx="1158.2" cy="267.5" r="5"/>
      <circle cx="1165.8" cy="376" r="5"/>
      <circle cx="1046.4" cy="338.8" r="5"/>
      <circle cx="1230.5" cy="562.7" r="5"/>
      <circle cx="1183.2" cy="655.2" r="5"/>
      <circle cx="1044.7" cy="913.2" r="5"/>
      <circle cx="323.1" cy="629.1" r="6"/>
    </g>

    <!-- Single clean label per dimension / context (generous spacing, zero collision) -->
    <g font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <!-- Road 128/2 well above 119/19 -->
      <rect x="745" y="102" width="204" height="28" rx="14" fill="#181A1B" fill-opacity="0.78"/>
      <text x="847" y="121" fill="#FFFFFF">Silnice p.č. 128/2 (sever)</text>

      <!-- Southern edge 70,08 m cleanly below the southern edge over open field -->
      <rect x="572" y="796" width="184" height="30" rx="15" fill="#181A1B" fill-opacity="0.88"/>
      <text x="664" y="816" fill="#FFFFFF">Jižní hrana 70,08 m</text>

      <!-- Quiet contextual text labels far from any card -->
      <text x="480" y="902" font-size="15" fill="#3C3422" font-weight="700" opacity="0.78">volná plocha p.č. 21/1 (jih)</text>
      <text x="1310" y="846" font-size="15" fill="#1E281B" font-weight="700" opacity="0.78">p.č. 11/2</text>
    </g>

    <!-- ONE clean card for p.č. 11/4 (centered inside eastern L-body, zero overlap) -->
    <g filter="url(#cardS)" font-family="Plus Jakarta Sans, Inter, Segoe UI, sans-serif">
      <rect x="858" y="578" width="218" height="90" rx="14" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="858" y="578" width="7" height="90" rx="3.5" fill="#2D4A3E"/>
      <text x="880" y="606" font-size="12" font-weight="700" letter-spacing="1.1" fill="#2D4A3E">p.č. 11/4 · HLAVNÍ</text>
      <text x="880" y="638" font-size="27" font-weight="700" fill="#181A1B">1 646 m²</text>
      <text x="880" y="658" font-size="12" font-weight="500" fill="#52575C">Zahrada · plocha SV</text>

      <!-- ONE clean card for p.č. 119/19 (placed clearly top-right with thin leader line) -->
      <line x1="1154" y1="312" x2="1226" y2="210" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.92"/>
      <circle cx="1154" cy="312" r="4" fill="#FFFFFF"/>
      <rect x="1226" y="160" width="232" height="86" rx="13" fill="#FFFFFF" fill-opacity="0.96"/>
      <rect x="1226" y="160" width="7" height="86" rx="3.5" fill="#A68A64"/>
      <text x="1247" y="186" font-size="11.5" font-weight="700" letter-spacing="1.0" fill="#8C714D">p.č. 119/19 · VJEZD</text>
      <text x="1247" y="215" font-size="22" font-weight="700" fill="#181A1B">97 m²</text>
      <text x="1247" y="234" font-size="11.5" font-weight="500" fill="#52575C">7,40 × 9,89 m · napojení 12,37 m</text>
    </g>

    <!-- North arrow (top-right corner, well above 119/19 card) -->
    <g transform="translate(1426, 76)" filter="url(#cardS)">
      <circle cx="0" cy="0" r="30" fill="#181A1B" fill-opacity="0.82" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4"/>
      <polygon points="0,-17 5.5,-1.5 0,-5 -5.5,-1.5" fill="#FFFFFF"/>
      <polygon points="0,17 5.5,1.5 0,5 -5.5,1.5" fill="#9CA3AF" opacity="0.6"/>
      <text x="0" y="-19" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text>
    </g>
  </g>
  <g transform="translate(24, 944)">
    <rect x="0" y="0" width="372" height="34" rx="17" fill="#181A1B" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#D8C29D"/>
    <text x="32" y="21.5" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#F4F3EF">Ilustrační náhled – reálné foto bude doplněno</text>
  </g>
</svg>