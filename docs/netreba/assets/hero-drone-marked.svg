<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="meadowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FA67A"/>
      <stop offset="55%" stop-color="#7D9668"/>
      <stop offset="100%" stop-color="#6F8A5B"/>
    </linearGradient>
    <linearGradient id="field21G" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9BA8A"/>
      <stop offset="100%" stop-color="#B6A472"/>
    </linearGradient>
    <linearGradient id="parcelLawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EB486"/>
      <stop offset="100%" stop-color="#8AA372"/>
    </linearGradient>
    <linearGradient id="drivewayG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9B4A6"/>
      <stop offset="100%" stop-color="#9FA988"/>
    </linearGradient>
    <linearGradient id="roofTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76A4A"/>
      <stop offset="100%" stop-color="#8B492F"/>
    </linearGradient>
    <linearGradient id="roofSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5056"/>
      <stop offset="100%" stop-color="#35393E"/>
    </linearGradient>
    <pattern id="mowP" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-21)">
      <rect width="13" height="26" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
    <pattern id="furrowP" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(21)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#8C7A4D" stroke-width="1.4" stroke-opacity="0.22"/>
    </pattern>
    <filter id="dropS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="8" stdDeviation="6" flood-color="#1B2518" flood-opacity="0.28"/>
    </filter>
    <filter id="cardS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E1512" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Base countryside -->
  <rect width="1500" height="1000" fill="url(#meadowG)"/>
  <rect width="1500" height="1000" fill="url(#mowP)"/>

  <!-- Open southern/southwestern field p.č. 21/1 below line 83-973 -> 15 -> 83-1118 -->
  <polygon points="0,500 323.1,629.1 1044.7,913.2 1353,1029.5 1500,1080 1500,1000 0,1000" fill="url(#field21G)"/>
  <polygon points="0,500 323.1,629.1 1044.7,913.2 1353,1029.5 1500,1080 1500,1000 0,1000" fill="url(#furrowP)"/>

  <!-- Target sunlit garden parcel p.č. 11/4 (true L-shape) -->
  <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="url(#parcelLawn)"/>
  <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="url(#mowP)"/>

  <!-- Target driveway parcel p.č. 119/19 -->
  <polygon points="1077.7,258.8 1158.2,267.5 1165.8,376 1046.4,338.8" fill="url(#drivewayG)"/>

  <!-- Eastern neighbor garden p.č. 11/2 -->
  <polygon points="1183.2,655.2 1357.1,736 1353,1029.5 1044.7,913.2" fill="#7D9669"/>

  <!-- Northern village asphalt road p.č. 128/2 running diagonally NW -> SE -->
  <polygon points="350,-20 680,-20 1125,198 1520,242 1520,308 1095,256 620,10 350,-20" fill="#8C9783"/>
  <polygon points="410,-20 655,-20 1118,205 1520,250 1520,298 1095,248 610,0 410,-20" fill="#5D6166"/>
  <polyline points="525,-18 1106,227 1520,274" fill="none" stroke="#E5E4DF" stroke-width="2" stroke-dasharray="16 20" opacity="0.45"/>

  <!-- Neighboring houses along NW/W side (č.p. 20, 56, 90, 22, 19) & NE (st. 8) -->
  <g filter="url(#dropS)">
    <!-- House č.p. 20 (NW of 11/4) -->
    <polygon points="845,205 975,268 912,402 782,339" fill="url(#roofTerra)"/>
    <line x1="814" y1="272" x2="944" y2="335" stroke="#E3A487" stroke-width="2" opacity="0.6"/>

    <!-- House č.p. 56 (south of č.p. 20, directly above inner L-bend) -->
    <polygon points="755,478 885,532 855,606 725,552" fill="url(#roofSlate)"/>

    <!-- House č.p. 90 (at western tip of L-arm) -->
    <polygon points="278,438 358,472 325,548 245,514" fill="url(#roofTerra)"/>

    <!-- House č.p. 22 & 19 further NW -->
    <polygon points="495,55 645,122 595,232 445,165" fill="url(#roofTerra)"/>
    <polygon points="705,152 785,188 745,275 665,239" fill="url(#roofSlate)"/>

    <!-- House st. 8 (NE of 11/4, east of 119/7) -->
    <polygon points="1275,305 1425,368 1372,492 1222,429" fill="url(#roofTerra)"/>
    <!-- Neighbor barn/outbuilding by 77-59 / 13 -->
    <polygon points="1165,432 1272,478 1244,544 1137,498" fill="url(#roofSlate)"/>
  </g>

  <!-- Realistic trees & greenery clusters -->
  <g opacity="0.92">
    <circle cx="485" cy="368" r="32" fill="#2A3923" opacity="0.28"/>
    <circle cx="478" cy="360" r="32" fill="#4B6A3C"/>
    <circle cx="471" cy="353" r="20" fill="#60814E"/>

    <circle cx="645" cy="435" r="28" fill="#2A3923" opacity="0.28"/>
    <circle cx="638" cy="428" r="28" fill="#547343"/>
    <circle cx="632" cy="422" r="17" fill="#698B56"/>

    <circle cx="1305" cy="695" r="38" fill="#2A3923" opacity="0.28"/>
    <circle cx="1296" cy="686" r="38" fill="#48663A"/>
    <circle cx="1288" cy="678" r="24" fill="#5D7E4B"/>

    <circle cx="195" cy="595" r="34" fill="#4B693C"/>
    <circle cx="1010" cy="410" r="22" fill="#567645" opacity="0.85"/>
    <circle cx="1065" cy="690" r="26" fill="#5B7B49" opacity="0.7"/>
  </g>
  <polygon points="1046.4,338.8 1165.8,376 1175.2,382.6 1189.8,390.4 1144.6,432.3 1109.1,505 1230.5,562.7 1183.2,655.2 1044.7,913.2 323.1,629.1 374.7,497.8 901.1,709.5" fill="#2D4A3E" fill-opacity="0.24" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"/>
  <polygon points="1077.7,258.8 1158.2,267.5 1165.8,376 1046.4,338.8" fill="#A68A64" fill-opacity="0.34" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <defs>
    <linearGradient id="heroScrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111614" stop-opacity="0.50"/>
      <stop offset="48%" stop-color="#111614" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#111614" stop-opacity="0.80"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="1000" fill="url(#heroScrim)"/>
</svg>