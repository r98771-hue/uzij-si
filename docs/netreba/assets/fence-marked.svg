      <text x="356" y="668" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2D4A3E">HLAVNÍ PARCELA · p.č. 11/4</text>
      <text x="356" y="698" font-size="22" font-weight="700" fill="#181A1B">1 646 m² (zahrada)</text>
    </g>
