<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <defs>
    <linearGradient id="skySide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87AFCF"/>
      <stop offset="60%" stop-color="#CEE0EA"/>
      <stop offset="100%" stop-color="#F2ECE0"/>
    </linearGradient>
    <linearGradient id="landSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96AC7C"/>
      <stop offset="55%" stop-color="#819968"/>
      <stop offset="100%" stop-color="#6B8354"/>
    </linearGradient>
    <filter id="shSide" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1714" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1500" height="415" fill="url(#skySide)"/>
  <!-- Afternoon southwest sun -->
  <circle cx="245" cy="165" r="88" fill="#FFF7DF" opacity="0.46"/>
  <circle cx="245" cy="165" r="38" fill="#FFFDF5" opacity="0.72"/>

  <!-- Distant hills -->
  <path d="M0,382 Q380,338 820,358 T1500,342 L1500,445 L0,445 Z" fill="#9EB09A"/>
  <path d="M0,415 Q520,388 1020,402 T1500,392 L1500,468 L0,468 Z" fill="#829876"/>

  <!-- Main terrain -->
  <polygon points="0,435 1500,415 1500,1000 0,1000" fill="url(#landSide)"/>
  <!-- Open field p.č. 21/1 in foreground/southwest -->
  <polygon points="0,665 1500,820 1500,1000 0,1000" fill="#C4B585"/>

  <!-- Village houses č.p. 90, 56, 20 along northern/western side -->
  <g>
    <rect x="255" y="455" width="95" height="58" fill="#E7E2D6"/>
    <polygon points="245,455 302,420 360,455" fill="#9E563B"/>

    <rect x="575" y="472" width="135" height="65" fill="#E3E2DD"/>
    <polygon points="562,472 642,438 722,472" fill="#464A50"/>

    <rect x="730" y="405" width="155" height="75" fill="#EAE5D9"/>
    <polygon points="718,405 807,365 896,405" fill="#A05A3F"/>
  </g>
  <g>
    <!-- Perspective projection of L-shaped p.č. 11/4 (1 646 m²) -->
    <polygon points="220,645 365,555 795,622 935,488 1075,512 1030,572 1170,602 1040,780" fill="#2D4A3E" fill-opacity="0.32" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Driveway p.č. 119/19 on northern side -->
    <polygon points="935,488 1075,512 1105,465 985,448" fill="#A68A64" fill-opacity="0.44" stroke="#FFFFFF" stroke-width="3"/>

    <g fill="#FFFFFF" stroke="#181A1B" stroke-width="2">
      <circle cx="220" cy="645" r="6"/><circle cx="1040" cy="780" r="6"/>
      <circle cx="1170" cy="602" r="6"/><circle cx="795" cy="622" r="5.5"/>
    </g>

    <!-- Dimensions & sun arc -->
    <path d="M120,265 Q285,110 495,215" fill="none" stroke="#FFF4CE" stroke-width="2.5" stroke-dasharray="8 6"/>
    <g font-family="Inter, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      <rect x="238" y="148" width="150" height="30" rx="15" fill="#181A1B" fill-opacity="0.8"/>
      <text x="313" y="168">Otevření na jih</text>

      <rect x="492" y="736" width="225" height="30" rx="15" fill="#181A1B" fill-opacity="0.88"/>
      <text x="604" y="756">Jižní hrana k p.č. 21/1: 70,08 m</text>
    </g>

    <g filter="url(#shSide)" font-family="Plus Jakarta Sans, Inter, sans-serif">
      <rect x="815" y="635" width="268" height="74" rx="12" fill="#FFFFFF" fill-opacity="0.95"/>
      <rect x="815" y="635" width="7" height="74" rx="3.5" fill="#2D4A3E"/>
      <text x="836" y="663" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2D4A3E">HLAVNÍ PARCELA · p.č. 11/4</text>
      <text x="836" y="690" font-size="20" font-weight="700" fill="#181A1B">1 646 m² (tvar písmene L)</text>
    </g>
  </g>
  <g transform="translate(24, 944)">
    <rect x="0" y="0" width="372" height="34" rx="17" fill="#181A1B" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#D8C29D"/>
    <text x="32" y="21.5" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#F4F3EF">Ilustrační náhled – reálné foto bude doplněno</text>
  </g>
</svg>